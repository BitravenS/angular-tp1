@if (cv(); as cv) {
  <div class="d-flex justify-content-center">
    <div class="col-lg-8 push-lg-4">
      <div class="tab-content p-b-3">
        <div class="tab-pane active" id="profile">
          <h1 class="h4 m-y-2">Cv {{ cv.firstname }} {{ cv.name }}</h1>
          <div class="d-flex justify-content-center">
            <img
              class="rounded-circle align-content-center"
              [ngSrc]="'assets/images/' + (cv.path | defaultImage)"
              width="150"
              height="150"
              [alt]="cv.name"
            />
          </div>
          <div class="row">
            <div class="col-md-12">
              <h2 class="h4 m-t-2">Informations</h2>
              <table class="table table-hover table-striped">
                <tbody>
                  <tr><td><strong>Name</strong> {{ cv.name }}</td></tr>
                  <tr><td><strong>Firstname</strong> {{ cv.firstname }}</td></tr>
                  <tr><td><strong>Job</strong> {{ cv.job }}</td></tr>
                  <tr><td><strong>Age</strong> {{ cv.age }}</td></tr>
                  <tr><td><strong>Cin</strong> {{ cv.cin }}</td></tr>
                </tbody>
              </table>
              <div class="d-flex justify-content-center">
                @if (authService.isAuthenticated()) {
                  <button type="button" (click)="deleteCv(cv)" class="btn btn-danger">Delete</button>
                }
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
}
